<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVote | Live Results</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #f2f4f6 100%);
            --glass-surface: rgba(255, 255, 255, 0.65);
            --primary-dark: #1A2333;
            --accent-blue: #007AFF;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --blur: blur(25px);
        }

        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.85); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .logo { display: flex; align-items: center; font-weight: 700; font-size: 1.4rem; color: var(--primary-dark); }
        .logo i { margin-right: 10px; color: var(--accent-blue); }
        .nav-links a { text-decoration: none; color: var(--text-muted); margin-left: 30px; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary-dark); }
        .nav-links .btn-nav { background: var(--primary-dark); color: white; padding: 10px 20px; border-radius: 8px; margin-left: 20px; }

        .container { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
        .header-section { text-align: center; margin-bottom: 50px; }
        .header-section h1 { font-size: 2.5rem; color: var(--primary-dark); margin-bottom: 10px; }
        .live-badge { background: #ff3b30; color: white; padding: 5px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; animation: blink 2s infinite; }
        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.6;} 100% {opacity: 1;} }

        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); text-align: center; border: 1px solid rgba(0,0,0,0.05); }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: var(--primary-dark); margin: 10px 0; display: block; }
        .stat-label { color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }

        .charts-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .chart-container { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.05); position: relative; }
        h3.chart-title { margin-top: 0; color: var(--primary-dark); font-size: 1.2rem; margin-bottom: 20px; }

        @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><i class="fas fa-vote-yea"></i> SecureVote</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html">Register</a>
            <a href="vote.html">Vote</a>
            <a href="results.html" class="btn-nav">Results</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <span class="live-badge">● Live Updates</span>
            <h1>Election Analytics</h1>
            <p style="color:var(--text-muted)">Real-time data from local storage.</p>
        </div>

        <div class="stats-row">
            <div class="stat-card">
                <i class="fas fa-users" style="color:var(--accent-blue); font-size:1.5rem;"></i>
                <span class="stat-number" id="total-votes">0</span>
                <span class="stat-label">Total Votes Cast</span>
            </div>
            <div class="stat-card">
                <i class="fas fa-crown" style="color:#F5A623; font-size:1.5rem;"></i>
                <span class="stat-number" id="leader-name" style="font-size:1.5rem; margin:18px 0;">--</span>
                <span class="stat-label">Leading Party</span>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h3 class="chart-title">Vote Comparison</h3>
                <canvas id="voteBarChart"></canvas>
            </div>
            <div class="chart-container">
                <h3 class="chart-title">Distribution</h3>
                <canvas id="voteDoughnutChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        const partyLabels = ['BJP', 'Congress', 'AAP', 'CPIM', 'TMC', 'Others'];
        const partyColors = ['#F47216', '#00BFFF', '#009F4D', '#DE2910', '#228B22', '#6c757d'];

        const barCtx = document.getElementById('voteBarChart').getContext('2d');
        const voteBarChart = new Chart(barCtx, {
            type: 'bar',
            data: {
                labels: partyLabels,
                datasets: [{
                    label: 'Votes',
                    data: [0, 0, 0, 0, 0, 0],
                    backgroundColor: partyColors,
                    borderRadius: 8,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f0f0f0' }, ticks: { precision: 0 } },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });

        const doughCtx = document.getElementById('voteDoughnutChart').getContext('2d');
        const voteDoughnutChart = new Chart(doughCtx, {
            type: 'doughnut',
            data: {
                labels: partyLabels,
                datasets: [{
                    data: [1,1,1,1,1,1],
                    backgroundColor: partyColors,
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                cutout: '70%',
                plugins: { legend: { position: 'bottom', labels: { boxWidth: 10 } } }
            }
        });

        async function fetchResults() {
            try {
                const response = await fetch('/api/results');
                const data = await response.json();

                const votes = [
                    data.BJP || 0,
                    data.Congress || 0,
                    data.AAP || 0,
                    data.CPIM || 0,
                    data.TMC || 0,
                    data.Others || 0
                ];

                const total = votes.reduce((a, b) => a + b, 0);
                document.getElementById('total-votes').innerText = total;

                // Find Leader
                let maxVotes = -1;
                let leader = "Tie";
                let tieCount = 0;
                for (let i = 0; i < votes.length; i++) {
                    if (votes[i] > maxVotes) {
                        maxVotes = votes[i];
                        leader = partyLabels[i];
                        tieCount = 1;
                    } else if (votes[i] === maxVotes) {
                        tieCount++;
                    }
                }
                if (total === 0) leader = "No Votes";
                else if (tieCount > 1) leader = "Tie";
                document.getElementById('leader-name').innerText = leader;

                // Update Charts
                voteBarChart.data.datasets[0].data = votes;
                voteBarChart.update();

                if (total === 0) {
                    voteDoughnutChart.data.datasets[0].data = [1,1,1,1,1,1];
                    voteDoughnutChart.data.datasets[0].backgroundColor = Array(6).fill('#e0e0e0');
                } else {
                    voteDoughnutChart.data.datasets[0].data = votes;
                    voteDoughnutChart.data.datasets[0].backgroundColor = partyColors;
                }
                voteDoughnutChart.update();

            } catch (e) { console.error(e); }
        }

        setInterval(fetchResults, 2000); // Poll every 2 seconds
        fetchResults();
    </script>
</body>
</html>
