<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SecureVote</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 0%, #ffffff 0%, #f2f4f6 100%);
            --primary-dark: #1A2333;
            --success-green: #34C759;
            --text-main: #1d1d1f;
            --glass-surface: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --blur: blur(25px);
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .container {
            background: var(--glass-surface); backdrop-filter: var(--blur);
            padding: 50px 40px; border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            width: 90%; max-width: 480px; text-align: center;
        }

        h2 { margin: 0 0 10px 0; font-size: 2.2rem; }
        .input-group { text-align: left; margin-bottom: 25px; }
        label { display: block; font-size: 0.95rem; font-weight: 600; margin-bottom: 10px; }
        input {
            width: 100%; padding: 16px; border: 1px solid #d2d2d7; border-radius: 14px;
            font-size: 1rem;
        }
        
        .camera-box {
            position: relative; 
            width: 100%; height: 350px; 
            background: #000; border-radius: 20px; 
            overflow: hidden; margin-bottom: 25px; 
        }

        /* FORCE VIDEO VISIBILITY */
        video { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            transform: scaleX(-1);
            display: block;
        }

        .progress-track {
            width: 100%; height: 8px; background: #e5e5e5; border-radius: 10px;
            overflow: hidden; margin-bottom: 20px; display: none;
        }
        .progress-fill { height: 100%; background: var(--success-green); width: 0%; transition: width 0.2s linear; }

        .btn {
            width: 100%; padding: 18px; background: var(--primary-dark);
            color: white; border: none; border-radius: 14px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>

    <a href="index.html" style="position: absolute; top: 30px; left: 30px; text-decoration: none; color: black;">
        <i class="fas fa-chevron-left"></i> Back
    </a>

    <div class="container">
        <h2>Voter Registration</h2>

        <div id="step-1">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="full-name" placeholder="Name">
            </div>
            <div class="input-group">
                <label>Aadhaar Number</label>
                <input type="number" id="aadhaar-num" placeholder="12 Digits">
            </div>
            <button class="btn" onclick="validateAndProceed()">Continue to Face Scan</button>
        </div>

        <div id="step-2" style="display:none;">
            <div class="camera-box">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>

            <div class="progress-track" id="progress-container">
                <div class="progress-fill" id="progress-bar"></div>
            </div>

            <p id="status-msg">Waiting for camera...</p>
            <button class="btn" id="scan-btn" onclick="startBurstCapture()">Start AI Scan</button>
        </div>
    </div>

    <script>
        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let userData = {};

        function validateAndProceed() {
            const name = document.getElementById("full-name").value.trim();
            const aadhaar = document.getElementById("aadhaar-num").value.trim();

            if (name.length < 3) return alert("Enter valid name");
            if (aadhaar.length !== 12) return alert("Aadhaar must be 12 digits");

            userData = { name: name, aadhaar: aadhaar };
            document.getElementById("step-1").style.display = "none";
            document.getElementById("step-2").style.display = "block";
            startCamera();
        }

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(stream => {
                    video.srcObject = stream;
                    video.play(); 
                    document.getElementById("status-msg").innerText = "Camera Active. Stay still.";
                })
                .catch(err => {
                    alert("Camera Error: " + err);
                });
        }

        async function startBurstCapture() {
            const btn = document.getElementById("scan-btn");
            const progressBar = document.getElementById("progress-bar");
            const progressContainer = document.getElementById("progress-container");
            const msg = document.getElementById("status-msg");

            btn.disabled = true;
            btn.innerText = "Scanning...";
            progressContainer.style.display = "block";

            let count = 0;
            const maxShots = 50; 
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            const intervalId = setInterval(async () => {
                if (count >= maxShots) {
                    clearInterval(intervalId);
                    finalizeRegistration();
                    return;
                }

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const dataURL = canvas.toDataURL('image/jpeg');

                try {
                    const response = await fetch('/api/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            aadhaar: userData.aadhaar, 
                            image: dataURL 
                        })
                    });
                    const result = await response.json();

                    if (result.status === 'success') {
                        count++;
                        const percent = (count / maxShots) * 100;
                        progressBar.style.width = percent + "%";
                        msg.innerText = `Capturing: ${count}/${maxShots}`;
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 100);
        }

        function finalizeRegistration() {
            document.querySelector(".container").innerHTML = `
                <h2 style="color:green;">Complete!</h2>
                <p>Data Saved.</p>
                <button class="btn" onclick="window.location.href='index.html'">Return Home</button>
            `;
        }
    </script>
</body>
</html>
